<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #e5e3df; }
        #map { height: 100%; width: 100%; }
    </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    try {
        var map = L.map('map').setView([-20.2133, -70.1503], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors',
            subdomains: 'abc'
        }).addTo(map);

        var marcadorUsuario = L.marker([-20.2133, -70.1503]).addTo(map)
            .bindPopup('Mi ubicación')
            .openPopup();

        var marcadorObjetivo = null;

        function actualizarUbicacion(lat, lng) {
            var nuevaPos = [lat, lng];
            map.setView(nuevaPos, 16);
            marcadorUsuario.setLatLng(nuevaPos);
        }

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            if (marcadorObjetivo) {
                marcadorObjetivo.setLatLng(e.latlng);
            } else {
                marcadorObjetivo = L.marker([lat, lng], {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                    })
                }).addTo(map);
            }
            marcadorObjetivo.bindPopup("Meta seleccionada").openPopup();

            if (window.AndroidBridge) {
                window.AndroidBridge.onObjetivoSeleccionado(lat, lng);
            }
        });

    } catch (e) {
        document.body.innerHTML = "<h3 style='color:red; padding:20px;'>Error JS: " + e.message + "</h3>";
    }
</script>
</body>
</html>
